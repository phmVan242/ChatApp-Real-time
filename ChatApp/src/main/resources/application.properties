# App name
spring.config.import=optional:file:.env[.properties]
spring.application.name=${APP_NAME:ChatApp}
jwt.expiration=86400000

# Database Properties
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Properties
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Server
server.port=${SERVER_PORT}

# Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── CORS / WebSocket ────────────────────────────────────────────────
# Danh sách origin pattern, phân tách bởi dấu phẩy ("*" = chấp nhận mọi origin).
# Dev: để "*". Production: liệt kê domain thật, ví dụ
#   https://chat.example.com,https://*.vercel.app
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:*}
